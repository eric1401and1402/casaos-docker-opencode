name: opencode
services:
  opencode:
    cpu_shares: 50
    command:
      - web
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    container_name: opencode
    deploy:
      resources:
        limits:
          memory: 1024M
    hostname: opencode
    image: ghcr.io/anomalyco/opencode:latest
    labels:
      icon: https://casaos.io
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - TZ=Asia/Taipei
    volumes:
      - type: bind
        source: /DATA/opencode/config
        target: /home/opencode/.opencode
      - type: bind
        source: /DATA/opencode/work
        target: /workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    devices: []
    cap_add: []
    network_mode: bridge
    privileged: false
x-casaos:
  author: eric1401and1402
  category: development
  hostname: ""
  icon: https://casaos.io
  index: /
  is_uncontrolled: false
  port_map: ""
  scheme: http
  store_app_id: opencode
  title:
    custom: ""
    en_us: OpenCode
